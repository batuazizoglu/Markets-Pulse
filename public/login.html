<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#000F64 0%,#001484 55%,#0014F2 100%);font-family:Arial,Helvetica,sans-serif;color:#001484;padding:24px}
.wrap{width:min(440px,100%)}.brand{text-align:center;color:white;margin-bottom:20px}.logo{font-size:36px;font-weight:900;letter-spacing:-1.5px}.logo span{color:#00C2FF}.tag{font-size:10px;letter-spacing:.22em;color:#C8D8FF;margin-top:7px;font-weight:700}
.card{background:white;border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.25)}h1{font-size:22px;margin:0 0 7px}p{font-size:12px;line-height:1.5;color:#667399;margin:0 0 22px}
label{display:block;font-size:10px;font-weight:800;color:#42526e;margin:12px 0 6px}.input{width:100%;height:46px;border:1px solid #d8e2f0;border-radius:11px;padding:0 13px;font-size:14px;color:#001484;outline:none}.input:focus{border-color:#0014F2;box-shadow:0 0 0 3px rgba(0,20,242,.11)}
button{width:100%;height:46px;border:0;border-radius:11px;background:#0014F2;color:white;font-size:13px;font-weight:800;cursor:pointer;margin-top:18px}button:disabled{opacity:.55}.err{display:none;margin-top:13px;background:#fff1f1;border:1px solid #f2b9bb;color:#a72930;border-radius:9px;padding:10px 12px;font-size:11px}.foot{text-align:center;color:#c8d8ff;font-size:9px;margin-top:16px}
</style></head>
<body><div class="wrap"><div class="brand"><div class="logo">Markets <span>Pulse</span></div><div class="tag">BY TURKCELL • COMPETITIVE INTELLIGENCE</div></div>
<div class="card"><h1>Platforma giriş</h1><p>Markets Pulse rekabet istihbaratı dashboard’una erişmek için kurumsal kullanıcı bilgilerinizle giriş yapın.</p>
<form id="f"><label>Kullanıcı adı veya e-posta</label><input class="input" id="identity" autocomplete="username" required autofocus>
<label>Parola</label><input class="input" id="password" type="password" autocomplete="current-password" required>
<button id="btn">Giriş Yap</button><div id="err" class="err"></div></form></div>
<div class="foot">Markets Pulse by Turkcell • Yetkili kullanıcı erişimi</div></div>
<script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Giriş yapılıyor…';
try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identity:document.getElementById('identity').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Giriş yapılamadı');location.href=d.redirect||'/'}catch(x){err.textContent=x.message;err.style.display='block'}finally{btn.disabled=false;btn.textContent='Giriş Yap'}});
</script></body></html>
