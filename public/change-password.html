<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markets Pulse • Parola Değiştir</title><meta name="theme-color" content="#000F64">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#000F64,#001484 60%,#0014F2);font-family:Arial,Helvetica,sans-serif;color:#001484;padding:24px}.wrap{width:min(460px,100%)}.brand{text-align:center;color:white;margin-bottom:20px}.logo{font-size:34px;font-weight:900}.logo span{color:#00C2FF}.tag{font-size:10px;letter-spacing:.2em;color:#C8D8FF;margin-top:6px}.card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.25)}h1{font-size:22px;margin:0 0 7px}p{font-size:12px;line-height:1.55;color:#667399;margin:0 0 20px}.note{background:#fff8de;border:1px solid #f0d66e;color:#6f5700;border-radius:9px;padding:10px 12px;font-size:10px;line-height:1.5;margin-bottom:16px}label{display:block;font-size:10px;font-weight:800;color:#42526e;margin:12px 0 6px}.input{width:100%;height:46px;border:1px solid #d8e2f0;border-radius:11px;padding:0 13px;font-size:14px;outline:none}.input:focus{border-color:#0014F2;box-shadow:0 0 0 3px rgba(0,20,242,.11)}button{width:100%;height:46px;border:0;border-radius:11px;background:#0014F2;color:#fff;font-size:13px;font-weight:800;cursor:pointer;margin-top:18px}.msg{display:none;margin-top:13px;border-radius:9px;padding:10px 12px;font-size:11px}.err{background:#fff1f1;border:1px solid #f2b9bb;color:#a72930}.ok{background:#edfaf6;border:1px solid #b8e9d8;color:#087356}
</style></head>
<body><div class="wrap"><div class="brand"><div class="logo">Markets <span>Pulse</span></div><div class="tag">FIRST LOGIN SECURITY</div></div><div class="card"><h1>Yeni parolanızı belirleyin</h1><p>Geçici parolanız yalnızca ilk giriş içindir. Devam etmek için kişisel bir parola oluşturun.</p><div class="note">En az 12 karakter, en az bir büyük harf, bir küçük harf ve bir rakam kullanın.</div>
<form id="f"><label>Mevcut / geçici parola</label><input class="input" id="current" type="password" autocomplete="current-password" required>
<label>Yeni parola</label><input class="input" id="next" type="password" autocomplete="new-password" required>
<label>Yeni parola tekrar</label><input class="input" id="again" type="password" autocomplete="new-password" required>
<button id="btn">Parolayı Kaydet ve Devam Et</button><div id="msg" class="msg"></div></form></div></div>
<script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const a=document.getElementById('next').value,b=document.getElementById('again').value;if(a!==b){msg.className='msg err';msg.textContent='Yeni parolalar eşleşmiyor.';msg.style.display='block';return}btn.disabled=true;btn.textContent='Kaydediliyor…';try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current').value,new_password:a})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Parola değiştirilemedi');msg.className='msg ok';msg.textContent='Parolanız güncellendi. Dashboard açılıyor…';msg.style.display='block';setTimeout(()=>location.href=d.redirect||'/',700)}catch(x){msg.className='msg err';msg.textContent=x.message;msg.style.display='block'}finally{btn.disabled=false;btn.textContent='Parolayı Kaydet ve Devam Et'}});
</script></body></html>
