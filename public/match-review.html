<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000f64"><title>Eşleşme İnceleme • Markets Pulse</title><style>
:root{--navy:#000f64;--blue:#0014f2;--cyan:#00c2ff;--yellow:#ffca00;--bg:#f5f8fc;--surface:#fff;--surface2:#f7f9fc;--ink:#071b52;--muted:#667399;--line:#dfe7f3;--good:#0b9f6e;--warn:#d79300;--bad:#d83b47;--shadow:0 12px 36px rgba(0,20,132,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}header{background:var(--navy);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:5;box-shadow:0 8px 30px rgba(0,15,100,.18)}.head{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--cyan)}.sub{font-size:10px;letter-spacing:.17em;color:#b9ccff;font-weight:800;margin-top:3px}.head-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:11px;font-weight:800;cursor:pointer}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.good{background:#e9fbf4;border-color:#bdebd9;color:#087753}.btn.warn{background:#fff8df;border-color:#f1d777;color:#775800}.btn.bad{background:#fff0f1;border-color:#f0c3c8;color:#a82631}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.back{background:transparent;border-color:#5365a4;color:#fff}main{max-width:1500px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:16px}.hero h1{font-size:28px;margin:0;letter-spacing:-.04em}.hero p{margin:6px 0 0;color:var(--muted);font-size:12px;max-width:900px;line-height:1.55}.engine{font-size:10px;color:var(--muted);font-weight:800}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:14px 0}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow)}.kpi span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:24px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;position:sticky;top:82px;z-index:4;box-shadow:0 8px 24px rgba(0,20,132,.05)}input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit;font-size:11px}.search{min-width:260px;flex:1}.toolbar select{min-width:140px}.count{font-size:10px;color:var(--muted);font-weight:800;margin-left:auto}.list{display:grid;gap:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.card.override{border-color:#9dc5ff;box-shadow:0 0 0 2px rgba(29,90,255,.06),var(--shadow)}.row-head{display:grid;grid-template-columns:minmax(0,1.1fr) 92px minmax(0,1.1fr) 170px;gap:14px;align-items:center}.product b{font-size:13px}.product small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.4}.score{text-align:center}.score strong{font-size:26px}.score small{display:block;color:var(--muted);font-size:9px}.status{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.Primary{background:#e6f8f1;color:#07704f}.Secondary{background:#eef4ff;color:#1149ad}.Review{background:#fff7db;color:#765800}.Reject{background:#fff0f1;color:#a32531}.decision{text-align:right}.decision small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.details{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.reason{font-size:10px;color:var(--muted);line-height:1.6}.penalty{color:#a82631;font-weight:800}.control{display:grid;grid-template-columns:minmax(240px,1fr) minmax(180px,.8fr);gap:8px}.control select,.control textarea{width:100%}.control textarea{min-height:72px;resize:vertical}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.override-note{margin-top:8px;padding:8px 10px;background:#f3f7ff;border:1px solid #d8e4fb;border-radius:8px;font-size:10px;color:#42526e}.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}.loading{opacity:.55;pointer-events:none}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.row-head{grid-template-columns:1fr 80px 1fr}.decision{grid-column:1/-1;text-align:left}.details{grid-template-columns:1fr}}@media(max-width:680px){main{padding:14px}.head{align-items:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.row-head{grid-template-columns:1fr}.score{text-align:left}.toolbar{top:78px}.control{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="head"><div><div class="brand">Markets <span>Pulse</span></div><div class="sub">BY TURKCELL • ADMIN MATCH REVIEW</div></div><div class="head-actions"><span id="who" class="sub"></span><button class="btn back" onclick="location.href='/#settings'">← Ayarlara Dön</button></div></div></header><main id="app"><div class="hero"><div><h1>Eşleşme İnceleme</h1><p>Comparable Product Engine v2.4 sonuçlarını inceleyin. Admin kararı otomatik eşleşmeyi ezmez; kalıcı override olarak ayrı saklanır. Canlı Ürün Karşılaştırma henüz shadow engine’e geçirilmemiştir.</p></div><div id="engine" class="engine">Yükleniyor…</div></div><div id="kpis" class="kpis"></div><div class="toolbar"><input id="q" class="search" placeholder="Telsim veya KKTCELL ürün ara…" oninput="render()"><select id="status" onchange="render()"><option value="all">Tüm Durumlar</option><option>Primary</option><option>Secondary</option><option>Review</option><option>Reject</option></select><select id="segment" onchange="render()"><option value="all">Tüm Segmentler</option></select><select id="override" onchange="render()"><option value="all">Tüm Kararlar</option><option value="manual">Sadece Override</option><option value="auto">Sadece Otomatik</option></select><button class="btn" onclick="load(true)">Kataloğu Yenile</button><span id="visibleCount" class="count"></span></div><div id="list" class="list"><div class="empty">Veriler yükleniyor…</div></div></main><script>
let DATA=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>n==null?'—':Number(n).toLocaleString('tr-TR');
async function api(url,opt){const r=await fetch(url,{cache:'no-store',...(opt||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function auth(){const d=await api('/api/auth/me');if(d.user?.role!=='admin'){alert('Bu ekran yalnızca admin kullanıcılar içindir.');location.href='/';throw new Error('admin required')}document.getElementById('who').textContent=(d.user.first_name+' '+d.user.last_name).trim()+' • Admin'}
function statusPill(s){return '<span class="status '+s+'">'+esc(s)+'</span>'}
function productLine(p){if(!p)return '<div class="product"><b>Eşleşme yok</b><small>Karşılaştırılabilir ürün bulunamadı</small></div>';return '<div class="product"><b>'+esc(p.name)+'</b><small>'+fmt(p.core_data_gb)+' GB + '+fmt(p.bonus_data_gb)+' GB • '+fmt(p.minutes)+' DK • '+fmt(p.validity_days)+' gün • '+fmt(p.price_try)+' TL'+(p.family?' • '+esc(p.family):'')+'</small></div>'}
function renderKpis(){const c=DATA.effective_counts||{},e=DATA.engine_counts||{};document.getElementById('kpis').innerHTML=[['Primary',c.Primary||0],['Secondary',c.Secondary||0],['Review',c.Review||0],['Reject',c.Reject||0],['Admin Override',DATA.override_count||0],['Eligible Pair',DATA.catalog?.eligible_pairs||0]].map(x=>'<div class="kpi"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');document.getElementById('engine').textContent=DATA.engine_version+' • '+DATA.catalog.telsim_core+' Telsim × '+DATA.catalog.kktcell_core+' KKTCELL • Engine '+(e.Primary||0)+'/'+(e.Secondary||0)+'/'+(e.Review||0)+'/'+(e.Reject||0)}
function candidateOptions(r){const selected=r.effective_match?.key||r.engine_match?.key||'';return (r.candidates||[]).map(c=>'<option value="'+esc(c.product.key)+'" '+(c.product.key===selected?'selected':'')+'>'+c.score+' • '+esc(c.product.name)+'</option>').join('')}
function render(){if(!DATA)return;const q=document.getElementById('q').value.toLocaleLowerCase('tr-TR'),st=document.getElementById('status').value,sg=document.getElementById('segment').value,ov=document.getElementById('override').value;const rows=DATA.rows.filter(r=>(st==='all'||r.effective_status===st)&&(sg==='all'||r.telsim.segment===sg)&&(ov==='all'||(ov==='manual'?!!r.override:!r.override))&&(!q||(r.telsim.name+' '+(r.effective_match?.name||'')+' '+(r.engine_match?.name||'')).toLocaleLowerCase('tr-TR').includes(q)));document.getElementById('visibleCount').textContent=rows.length+' / '+DATA.rows.length+' ürün';document.getElementById('list').innerHTML=rows.length?rows.map(r=>'<article class="card '+(r.override?'override':'')+'"><div class="row-head">'+productLine(r.telsim)+'<div class="score"><strong>'+r.engine_score+'</strong><small>Similarity'+(r.mutual_best?' • Mutual':'')+'</small></div>'+productLine(r.effective_match)+'<div class="decision">'+statusPill(r.effective_status)+'<small>Engine: '+r.engine_status+(r.override?' • Admin override':' • Otomatik')+'</small></div></div><div class="details"><div class="reason"><b>Eşleşme gerekçesi</b><br>'+esc((r.reasons||[]).join(' • '))+(r.penalties?.length?'<br><span class="penalty">'+esc(r.penalties.join(' • '))+'</span>':'')+(r.score_margin!=null?'<br>Runner-up farkı: '+r.score_margin+' puan':'')+'</div><div><div class="control"><select id="cand-'+r.telsim_product_id+'">'+candidateOptions(r)+'</select><textarea id="note-'+r.telsim_product_id+'" placeholder="Opsiyonel admin notu…">'+esc(r.override?.note||'')+'</textarea></div><div class="actions"><button class="btn good" onclick="decide('+r.telsim_product_id+',\'primary\')">Primary Onayla</button><button class="btn primary" onclick="decide('+r.telsim_product_id+',\'secondary\')">Secondary Tut</button><button class="btn bad" onclick="decide('+r.telsim_product_id+',\'reject\')">Eşleşme Değil</button>'+(r.override?'<button class="btn" onclick="resetDecision('+r.telsim_product_id+')">Otomatiğe Dön</button>':'')+'</div>'+(r.override?'<div class="override-note"><b>Override:</b> '+esc(r.override.updated_by||'Admin')+' • '+new Date(r.override.updated_at).toLocaleString('tr-TR')+(r.override.stale?' • <b>Seçili ürün artık katalogda yok</b>':'')+'</div>':'')+'</div></div></article>').join(''):'<div class="empty">Bu filtrelerde eşleşme bulunamadı.</div>'}
async function decide(id,decision){const sel=document.getElementById('cand-'+id),note=document.getElementById('note-'+id)?.value||'';if(decision!=='reject'&&!sel?.value)return alert('Önce bir KKTCELL ürünü seçin.');if(decision==='reject'&&!confirm('Bu eşleşme Reject olarak işaretlensin mi?'))return;document.getElementById('app').classList.add('loading');try{await api('/api/admin/match-review/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({decision,kktcell_product_key:decision==='reject'?null:sel.value,note})});await load(false)}catch(e){alert(e.message)}finally{document.getElementById('app').classList.remove('loading')}}
async function resetDecision(id){if(!confirm('Admin override silinsin ve ürün otomatik motora dönsün mü?'))return;document.getElementById('app').classList.add('loading');try{await api('/api/admin/match-review/'+id,{method:'DELETE'});await load(false)}catch(e){alert(e.message)}finally{document.getElementById('app').classList.remove('loading')}}
async function load(refresh=false){document.getElementById('app').classList.add('loading');try{DATA=await api('/api/admin/match-review'+(refresh?'?refresh=1':''));renderKpis();const seg=document.getElementById('segment'),cur=seg.value;seg.innerHTML='<option value="all">Tüm Segmentler</option>'+[...new Set(DATA.rows.map(x=>x.telsim.segment))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');seg.value=[...seg.options].some(o=>o.value===cur)?cur:'all';render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}finally{document.getElementById('app').classList.remove('loading')}}
(async()=>{try{await auth();await load(false)}catch(e){console.error(e)}})();
</script></body></html>
