name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
      - name: Home internet desktop and mobile layouts
        run: node test/home-internet-layout.mjs
      - name: Ad analysis desktop and mobile layouts
        run: node test/ad-visual-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-internet-layouts
          path: test-output/
